version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aso_saude
      POSTGRES_USER: aso_user
      POSTGRES_PASSWORD: aso_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://aso_user:aso_pass@postgres:5432/aso_saude
      JWT_SECRET: ${JWT_SECRET:-aso_jwt_secret_dev}
      PORT: 3001
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
