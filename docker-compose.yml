version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v1.7.0
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=essencial2026secret
      - AUTHENTICATION_TYPE=apikey
      - QRCODE_LIMIT=30
      - QRCODE_EXPIRATION_TIME=60
      - WEBHOOK_URL=http://host.docker.internal:5000/webhook/evolution
      - WEBHOOK_BY_EVENTS=false
      - WEBHOOK_BASE64=true
      - WEBHOOK_EVENTS=QRCODE_UPDATED,CONNECTION_UPDATE,MESSAGES_UPSERT,MESSAGES_UPDATE,SEND_MESSAGE
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Windows
      - DEL_INSTANCE=false
      - DATABASE_ENABLED=false
      - LOG_LEVEL=ERROR
    volumes:
      - ./evolution_data/instances:/evolution/instances
      - ./evolution_data/store:/evolution/store