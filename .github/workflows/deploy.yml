name: Deploy to Hetzner

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/essencialsaude
            git pull origin main
            
            # Atualiza dependências Backend
            cd backend
            npm install
            
            # Atualiza Banco (Migrations)
            # Opcional: Descomente se quiser rodar migrations automaticamente
            # node src/utils/migration_*.js
            
            # Atualiza Frontend
            cd ../frontend
            npm install
            npm run build
            
            # Reinicia Serviços
            pm2 restart all
            echo "🚀 Deploy Concluído com Sucesso!"
